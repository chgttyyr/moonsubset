name: MoonSubset CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MoonBit CLI Toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify Environment
        run: |
          moon version

      - name: Type Check Project
        run: |
          moon check

      - name: Run Test Suite (17 Tests)
        run: |
          moon test

      - name: Build Executable Artifacts (Native & Wasm)
        run: |
          moon build
          moon build --target wasm

      - name: Verify CLI Functionality
        run: |
          moon run cmd/main -- --help
          moon run cmd/main -- info -f fixtures/test-font.ttf
          moon run cmd/main -- subset -f fixtures/test-font.ttf -c "Hello MoonBit!" -o fixtures/ci-output.ttf --css "CITestFont"
          moon run cmd/main -- subset -f fixtures/test-font.ttf -u "U+0020-U+007E" -o fixtures/ci-range.ttf
